name: E2E

on:
  push:
    branches: [main, ci-e2e]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-ci-password
          MYSQL_DATABASE: gamehub_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pe2e-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Valores desechables: la BD se crea y se destruye en cada ejecución. No son secretos reales.
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: e2e-ci-password
      # Debe ser Base64 (JwtServiceImpl lo decodifica) y de al menos 32 bytes.
      JWT_SECRET: ZTJlLWNpLXRocm93YXdheS1qd3Qtc2VjcmV0LWtleS0wMTIzNDU2Nzg5YWJjZGVm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            frontend/gamehub/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend/gamehub
        run: npm ci

      - name: Instalar dependencias de e2e
        working-directory: e2e
        run: npm ci

      - name: Instalar Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        working-directory: e2e
        run: npx playwright test

      - name: Subir reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Subir trazas y capturas de los fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 14
