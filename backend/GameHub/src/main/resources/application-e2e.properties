# ===============================
# PERFIL E2E (pruebas Playwright)
# BD dedicada, esquema limpio en cada arranque y datos semilla deterministas
# ===============================
server.port=${SERVER_PORT:8090}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_E2E_DB:gamehub_e2e}?serverTimezone=America/Bogota
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# import.sql crea el usuario admin; e2e-seed.sql los videojuegos de prueba (una sentencia por linea)
spring.jpa.properties.hibernate.hbm2ddl.import_files=import.sql,e2e-seed.sql

# Frontend levantado por Playwright
app.cors.allowed-origins=${E2E_FRONTEND_URL:http://localhost:5174}

# JWT
app.jwt.secret_key=${JWT_SECRET}

# Cloudinary: no se usa en los flujos E2E (los juegos vienen del seed, sin imagen)
cloudinary.cloud_name=${CLOUD_NAME:e2e}
cloudinary.api_key=${API_KEY:e2e}
cloudinary.api_secret=${API_SECRET:e2e}
